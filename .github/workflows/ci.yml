name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · coverage · path-dep gate.
  #
  # MSRV is read from rust-version (1.85), which is what the old `msrv` job
  # pinned by hand, so it needs no input.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f9802dca64a95eb881fd05dd3f4f16e53b97f2b3
    with:
      # Carried across: the old `test` job installed qemu-utils before running
      # the suite (qemu-img builds the VHDX fixtures the reader is tested
      # against). Dropping it would fail the tests, not skip them.
      system-packages: qemu-utils
      # Carried across: the old `test` job was `runs-on: ubuntu-latest` with no
      # OS matrix, precisely because qemu-utils is apt-only. Leaving the default
      # (3 OS) on would newly run this suite on macOS and Windows, where the
      # fixture-building step cannot install — an expansion this adoption PR has
      # no mandate to make.
      os-matrix: false
      # This repo had NO coverage job at all, so there is no existing decision to
      # carry. Inheriting the default strict per-line gate would be a new gate
      # invented by an adoption PR, so the floor is set to the MEASURED value
      # instead: `cargo llvm-cov --workspace --all-features --summary-only` on
      # origin/main reports 83.17% lines (2578 lines, 434 missed). Floored to 83.
      # Measured locally WITHOUT qemu-utils, so some fixture-backed tests were
      # skipped; CI installs it and will run more of them, which can only move
      # the number up. 83 is therefore a conservative floor, not a ceiling.
      coverage-gate: floor
      coverage-floor: 83

  # Repo-specific reporting, copied verbatim from the old ci.yml. Not a gate
  # (continue-on-error), so it stays outside the shared workflow.
  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    # Reporting only — transitive deps (e.g. crc32fast SIMD) use unsafe legitimately.
    # Review the output; a spike vs baseline warrants investigation.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
