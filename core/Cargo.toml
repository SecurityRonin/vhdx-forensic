[package]
name = "vhdx-core"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust VHDX (Hyper-V) virtual-disk container library — reader (writer planned), hardened for forensic use"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/SecurityRonin/vhdx-forensic"
documentation = "https://docs.rs/vhdx-core"
authors = ["Albert Hui"]
keywords = ["forensics", "vhdx", "disk-image", "windows", "hyper-v"]
categories = ["parser-implementations", "filesystem"]
readme = "README.md"
exclude = ["tests/"]

[lib]
name = "vhdx"

[features]
# Implement the forensic-vfs ImageSource contract so a decoded VHDX composes
# directly into the fleet VFS. Off by default (optional forensic-vfs dep).
vfs = ["dep:forensic-vfs"]

[dependencies]
thiserror = { workspace = true }
forensic-vfs = { version = "0.3", optional = true }

[dev-dependencies]
# TODO(before merge): must become `forensic-testgate = "0.1"` once published. A
# cross-repo path dependency resolves locally but breaks every tool that clones the
# repo alone — release-plz, `cargo package`, `cargo publish --dry-run`. It must not
# reach main.
forensic-testgate = { path = "/Users/4n6h4x0r/.claude/jobs/6125d941/tmp/forensic-testgate" }
tempfile = { workspace = true }
forensic-vfs = "0.3"

[lints]
workspace = true
